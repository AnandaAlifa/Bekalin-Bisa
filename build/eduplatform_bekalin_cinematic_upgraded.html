<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEKALIN — Platform Pembelajaran Digital Nasional</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Bekalin Custom Theme Styling */
        .bekalin-gradient {
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 50%, #e0f2fe 100%);
        }
        .bekalin-box {
            background: #ffffff;
            border: 2px solid #5746d8;
            border-radius: 16px;
            box-shadow: 4px 4px 0px #5746d8;
        }
        .bekalin-button {
            background: #ec4899;
            color: white;
            font-weight: 700;
            border: 2px solid #be185d;
            border-radius: 12px;
            box-shadow: 3px 3px 0px #831843;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .bekalin-button:hover {
            transform: translateY(-2px);
            box-shadow: 4px 6px 0px #831843;
        }
        .bekalin-button:active {
            transform: translateY(1px);
            box-shadow: 1px 2px 0px #831843;
        }

        /* --- Cinematic & Dynamic Pop Animation System --- */
        @keyframes cinFadeInUp {
            0% { opacity: 0; transform: translateY(16px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes cinFadeOutDown {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(12px) scale(0.96); }
        }
        @keyframes cinPopIn {
            0% { opacity: 0; transform: scale(0.92) translateY(8px); }
            60% { transform: scale(1.02) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes cinPopOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.94); }
        }
        @keyframes cinSlideUp {
            0% { transform: translateY(100%); opacity: 0.8; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes cinSlideDown {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }

        .animate-fade-in {
            animation: cinFadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-pop-in {
            animation: cinPopIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-slide-up {
            animation: cinSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-slide-down {
            animation: cinSlideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Staggered Delay Classes */
        .stagger-1 { animation-delay: 50ms; }
        .stagger-2 { animation-delay: 100ms; }
        .stagger-3 { animation-delay: 150ms; }
        .stagger-4 { animation-delay: 200ms; }
        .stagger-5 { animation-delay: 250ms; }
        .stagger-6 { animation-delay: 300ms; }

        /* Reduced Motion Support */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased min-h-screen flex flex-col selection:bg-pink-500 selection:text-white">

    <!-- Main App Root Container -->
    <div id="app" class="flex flex-col min-h-screen pb-20 md:pb-0"></div>

    <!-- Notification Modal & Exam Lockdown System Container -->
    <div id="modal-container"></div>

    <!-- Mobile More Menu Bottom Sheet Container -->
    <div id="mobile-more-container"></div>

    <script>
        const state = {
            currentView: 'login', // 'login', 'signup', 'forgot', 'dashboard'
            user: null, // { name, email, username, role, schoolName, className, sourceMode, bio }
            activeTab: 'materi', // 'materi', 'lab', 'ujian', 'jadwal', 'konsul', 'admin', 'teacher', 'profil'
            selectedSubject: null,
            selectedClassGrade: '11',
            selectedLab: 'fisika',
            activeExam: null,
            examViolations: 0,
            isExamLocked: false,
            isMobileMoreOpen: false,
            usersList: [
                { email: 'budi@student.sch.id', pass: 'siswa123', name: 'Budi Santoso', username: 'budisantoso', role: 'student', schoolName: 'SMA Negeri 1 Jakarta', className: 'Kelas 11 IPA 2', sourceMode: 'COMPANY_PLUS_SCHOOL', bio: 'Siswa kelas 11 yang antusias dengan Fisika dan Pemrograman.' },
                { email: 'admin@school.sch.id', pass: 'admin123', name: 'Dra. Siti Aminah', username: 'sitiaminah', role: 'school_admin', schoolName: 'SMA Negeri 1 Jakarta', className: 'Kelas Admin (Sekolah)', sourceMode: 'COMPANY_PLUS_SCHOOL', bio: 'Administrator sekolah resmi yang ditugaskan mengelola akun dan konfigurasi.' },
                { email: 'guru@school.sch.id', pass: 'guru123', name: 'Ahmad Fauzi, S.Pd', username: 'ahmadfauzi', role: 'teacher', schoolName: 'SMA Negeri 1 Jakarta', className: 'Kelas Guru Pengampu', sourceMode: 'COMPANY_PLUS_SCHOOL', bio: 'Guru pengampu mata pelajaran Fisika dan Matematika.' }
            ]
        };

        function showNotification(title, message, type = 'info', onConfirm = null) {
            const container = document.getElementById('modal-container');
            const colorClass = type === 'error' ? 'bg-red-50 text-red-800 border-red-200' : (type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-blue-50 text-blue-800 border-blue-200');
            
            container.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 animate-fade-in" role="dialog" aria-modal="true">
                    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 border-2 ${type === 'error' ? 'border-red-400' : 'border-indigo-600'} animate-pop-in">
                        <div class="flex items-center space-x-3 mb-3">
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center ${type === 'error' ? 'bg-red-100 text-red-600 border-2 border-red-300' : 'bg-pink-100 text-pink-600 border-2 border-pink-300'} shadow">
                                <i class="fa-solid ${type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info'} text-xl"></i>
                            </div>
                            <h3 class="font-black text-xl text-indigo-900">${title}</h3>
                        </div>
                        <p class="text-slate-600 text-sm mb-6 leading-relaxed">${message}</p>
                        <div class="flex justify-end space-x-3">
                            <button id="modal-ok-btn" class="bekalin-button px-6 py-2.5 text-sm" autofocus>Mengerti</button>
                        </div>
                    </div>
                </div>
            `;
            const closeModal = () => {
                const dialog = container.firstElementChild;
                if (dialog) {
                    dialog.classList.remove('animate-fade-in');
                    dialog.classList.add('animate-slide-down');
                }
                setTimeout(() => {
                    container.innerHTML = '';
                    if (onConfirm) onConfirm();
                }, 300);
            };
            document.getElementById('modal-ok-btn').onclick = closeModal;
            container.onclick = (e) => { if (e.target === container) closeModal(); };
        }

        // Centralized Navigation Controller with Cinematic Transitions
        function navigateToTab(tabName) {
            if (state.activeTab === tabName && !state.selectedSubject) return;
            state.activeTab = tabName;
            state.selectedSubject = null;
            state.isMobileMoreOpen = false;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderAuth() {
            const app = document.getElementById('app');
            if (state.currentView === 'login') {
                app.innerHTML = `
                    <div class="flex-1 flex items-center justify-center bekalin-gradient p-4 animate-fade-in">
                        <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl max-w-sm w-full p-8 border-2 border-indigo-600 text-center animate-pop-in">
                            <div class="mb-6">
                                <div class="w-28 h-28 rounded-full bg-indigo-100 border-4 border-indigo-600 flex flex-col items-center justify-center mx-auto shadow-lg mb-3 hover:scale-105 transition transform duration-300">
                                    <h1 class="text-lg font-black tracking-tighter text-indigo-900">WELCOME</h1>
                                    <span class="text-pink-600 font-extrabold text-2xl tracking-normal">BEKAL<span class="text-indigo-600">in</span></span>
                                </div>
                            </div>

                            <form id="login-form" class="space-y-4 text-left">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email / Username</label>
                                    <input type="text" id="login-id" required placeholder="contoh: budi@student.sch.id" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm focus:outline-none focus:border-pink-600 transition shadow-inner">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Kata Sandi</label>
                                    <input type="password" id="login-pass" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm focus:outline-none focus:border-pink-600 transition shadow-inner">
                                    <div class="text-right mt-1.5">
                                        <a href="#" onclick="state.currentView='forgot'; render(); return false;" class="text-xs text-indigo-600 hover:underline font-bold">Lupa Kata Sandi?</a>
                                    </div>
                                </div>
                                <button type="submit" class="w-full bekalin-button py-3.5 text-sm uppercase tracking-wide">
                                    LOGIN
                                </button>
                            </form>

                            <div class="mt-4 pt-4 border-t border-slate-200">
                                <button onclick="state.currentView='signup'; render();" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl border-2 border-indigo-800 shadow transition text-sm uppercase tracking-wide hover:scale-[1.02] active:scale-[0.98]">
                                    SIGN UP
                                </button>
                            </div>

                            <div class="mt-4 p-3 bg-pink-50 rounded-xl border border-pink-200 text-xs text-pink-800 text-center shadow-sm">
                                <p class="font-bold mb-1">Akun Demo Bekalin:</p>
                                <p>Siswa: <code class="bg-pink-100 px-1 rounded font-bold">budi@student.sch.id</code> / <code class="bg-pink-100 px-1 rounded font-bold">siswa123</code></p>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('login-form').onsubmit = (e) => {
                    e.preventDefault();
                    const id = document.getElementById('login-id').value.trim();
                    const pass = document.getElementById('login-pass').value;
                    const found = state.usersList.find(u => (u.email === id || u.username === id) && u.pass === pass);
                    if (found) {
                        state.user = found;
                        state.currentView = 'dashboard';
                        state.activeTab = found.role === 'teacher' ? 'teacher' : (found.role === 'school_admin' ? 'admin' : 'materi');
                        render();
                    } else {
                        showNotification('Gagal Masuk', 'Email/username atau kata sandi yang Anda masukkan salah.', 'error');
                    }
                };
            } else if (state.currentView === 'signup') {
                app.innerHTML = `
                    <div class="flex-1 flex items-center justify-center bekalin-gradient p-4 animate-fade-in">
                        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 border-2 border-indigo-600 animate-pop-in">
                            <div class="text-center mb-6">
                                <h2 class="text-2xl font-black text-indigo-900">Daftar Akun Bekalin</h2>
                                <p class="text-slate-500 text-xs mt-1">Platform Pembelajaran Digital</p>
                            </div>
                            <form id="signup-form" class="space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap</label>
                                    <input type="text" id="su-name" required placeholder="Nama Lengkap" class="w-full px-3 py-2.5 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm focus:border-pink-600">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Email Sekolah</label>
                                    <input type="email" id="su-email" required placeholder="nama@student.sch.id" class="w-full px-3 py-2.5 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm focus:border-pink-600">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Kata Sandi</label>
                                    <input type="password" id="su-pass" required placeholder="••••••••" class="w-full px-3 py-2.5 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm focus:border-pink-600">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Kelas / Rombel</label>
                                    <select id="su-class" class="w-full px-3 py-2.5 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm focus:border-pink-600">
                                        <option value="Kelas 10 IPA">Kelas 10 SMA</option>
                                        <option value="Kelas 11 IPA">Kelas 11 SMA</option>
                                        <option value="Kelas 12 SMK">Kelas 12 SMK</option>
                                    </select>
                                </div>
                                <button type="submit" class="w-full bekalin-button py-3 text-sm mt-2">DAFTAR SEKARANG</button>
                            </form>
                            <div class="mt-4 text-center">
                                <a href="#" onclick="state.currentView='login'; render(); return false;" class="text-xs text-indigo-600 font-bold hover:underline">Kembali ke Halaman Masuk</a>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('signup-form').onsubmit = (e) => {
                    e.preventDefault();
                    const pass = document.getElementById('su-pass').value;
                    const emojiRegex = /(\p{Emoji_Presentation}|\p{Extended_Pictographic})/u;
                    if (emojiRegex.test(pass)) {
                        showNotification('Validasi Sandi', 'Kata sandi tidak boleh mengandung emoji!', 'error');
                        return;
                    }
                    const newUser = {
                        email: document.getElementById('su-email').value,
                        pass: pass,
                        name: document.getElementById('su-name').value,
                        username: document.getElementById('su-email').value.split('@')[0],
                        role: 'student',
                        schoolName: 'SMA Negeri Mitra',
                        className: document.getElementById('su-class').value,
                        sourceMode: 'COMPANY_PLUS_SCHOOL',
                        bio: 'Siswa baru terdaftar di Bekalin.'
                    };
                    state.usersList.push(newUser);
                    state.user = newUser;
                    state.currentView = 'dashboard';
                    state.activeTab = 'materi';
                    showNotification('Registrasi Berhasil', 'Akun Anda berhasil didaftarkan. Selamat datang!', 'success', () => render());
                };
            } else if (state.currentView === 'forgot') {
                app.innerHTML = `
                    <div class="flex-1 flex items-center justify-center bekalin-gradient p-4 animate-fade-in">
                        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 border-2 border-indigo-600 text-center animate-pop-in">
                            <h2 class="text-xl font-bold mb-2 text-indigo-900">Pemulihan Kata Sandi</h2>
                            <p class="text-xs text-slate-500 mb-6">Masukkan email akun Anda untuk menerima instruksi reset.</p>
                            <input type="email" placeholder="email@domain.sch.id" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm mb-4">
                            <button onclick="showNotification('Tautan Terkirim', 'Instruksi pemulihan telah dikirim ke email Anda.', 'info', ()=>{state.currentView='login'; render();})" class="w-full bekalin-button py-3 text-sm">Kirim Instruksi</button>
                            <div class="mt-4">
                                <a href="#" onclick="state.currentView='login'; render(); return false;" class="text-xs text-indigo-600 font-bold">Batal</a>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function renderDashboard() {
            const app = document.getElementById('app');
            const u = state.user;

            app.innerHTML = `
                <!-- Top Header Bar -->
                <header class="bg-white border-b-2 border-indigo-600 sticky top-0 z-40 px-4 md:px-6 py-3 flex justify-between items-center shadow-sm">
                    <div class="flex items-center space-x-3">
                        <div onclick="navigateToTab('materi')" class="flex items-center space-x-2 cursor-pointer group">
                            <div class="bg-indigo-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-black shadow border border-indigo-800 group-hover:scale-110 transition">
                                B
                            </div>
                            <span class="font-black text-xl text-indigo-900 tracking-tight">BEKAL<span class="text-pink-600">in</span></span>
                        </div>
                        <span class="text-xs bg-pink-100 text-pink-700 font-bold px-3 py-1 rounded-full border border-pink-200 hidden sm:inline-block shadow-sm">
                            ${u.schoolName} (${u.sourceMode})
                        </span>
                    </div>

                    <!-- Profile Trigger Button -->
                    <div onclick="navigateToTab('profil')" class="flex items-center space-x-3 cursor-pointer hover:bg-slate-50 p-1.5 rounded-xl transition border-2 border-transparent hover:border-indigo-300">
                        <div class="text-right hidden sm:block">
                            <p class="font-bold text-sm text-slate-800">${u.name}</p>
                            <p class="text-xs text-slate-500">${u.className} • <span class="capitalize text-pink-600 font-bold">${u.role}</span></p>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-pink-600 text-white flex items-center justify-center font-bold text-sm shadow border-2 border-white hover:scale-105 transition">
                            ${u.name.charAt(0)}
                        </div>
                    </div>
                </header>

                <div class="flex flex-1 flex-col md:flex-row relative">
                    <!-- Desktop Sidebar Menu -->
                    <aside class="hidden md:flex w-64 bg-white border-r-2 border-indigo-600 p-6 flex-col space-y-2 sticky top-[65px] h-[calc(100vh-65px)] overflow-y-auto">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-3">Menu Bekalin</p>
                        
                        <button onclick="navigateToTab('materi')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-sm transition ${state.activeTab==='materi' ? 'bg-pink-600 text-white shadow-md border-2 border-pink-800 translate-x-1' : 'text-slate-700 hover:bg-slate-100'}">
                            <i class="fa-solid fa-book-open w-5 text-center"></i>
                            <span>MATERI</span>
                        </button>

                        <button onclick="navigateToTab('lab')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-sm transition ${state.activeTab==='lab' ? 'bg-pink-600 text-white shadow-md border-2 border-pink-800 translate-x-1' : 'text-slate-700 hover:bg-slate-100'}">
                            <i class="fa-solid fa-flask w-5 text-center"></i>
                            <span>PRAKTIK & LAB</span>
                        </button>

                        <button onclick="navigateToTab('ujian')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-sm transition ${state.activeTab==='ujian' ? 'bg-pink-600 text-white shadow-md border-2 border-pink-800 translate-x-1' : 'text-slate-700 hover:bg-slate-100'}">
                            <i class="fa-solid fa-file-pen w-5 text-center"></i>
                            <span>UJIAN / TES</span>
                        </button>

                        <button onclick="navigateToTab('jadwal')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-sm transition ${state.activeTab==='jadwal' ? 'bg-pink-600 text-white shadow-md border-2 border-pink-800 translate-x-1' : 'text-slate-700 hover:bg-slate-100'}">
                            <i class="fa-solid fa-calendar-days w-5 text-center"></i>
                            <span>JADWAL</span>
                        </button>

                        <button onclick="navigateToTab('konsul')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-sm transition ${state.activeTab==='konsul' ? 'bg-pink-600 text-white shadow-md border-2 border-pink-800 translate-x-1' : 'text-slate-700 hover:bg-slate-100'}">
                            <i class="fa-solid fa-comments w-5 text-center"></i>
                            <span>KONSULTASI</span>
                        </button>

                        <button onclick="navigateToTab('profil')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-sm transition ${state.activeTab==='profil' ? 'bg-pink-600 text-white shadow-md border-2 border-pink-800 translate-x-1' : 'text-slate-700 hover:bg-slate-100'}">
                            <i class="fa-solid fa-user w-5 text-center"></i>
                            <span>PROFIL SAYA</span>
                        </button>

                        ${u.role === 'teacher' || u.role === 'school_admin' ? `
                            <div class="pt-4 mt-4 border-t-2 border-slate-200">
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-3">Panel Guru</p>
                                <button onclick="navigateToTab('teacher')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-sm transition ${state.activeTab==='teacher' ? 'bg-indigo-600 text-white shadow-md translate-x-1' : 'text-slate-700 hover:bg-slate-100'}">
                                    <i class="fa-solid fa-chalkboard-user w-5 text-center"></i>
                                    <span>TAMBAH UJIAN / EDIT</span>
                                </button>
                            </div>
                        ` : ''}

                        ${u.role === 'school_admin' ? `
                            <button onclick="navigateToTab('admin')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-sm transition ${state.activeTab==='admin' ? 'bg-indigo-600 text-white shadow-md translate-x-1' : 'text-slate-700 hover:bg-slate-100'}">
                                <i class="fa-solid fa-shield-halved w-5 text-center"></i>
                                <span>MENU ADMIN</span>
                            </button>
                        ` : ''}

                        <div class="pt-6 mt-auto">
                            <button onclick="state.user=null; state.currentView='login'; render();" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-sm text-red-600 hover:bg-red-50 transition border-2 border-red-200">
                                <i class="fa-solid fa-right-from-bracket w-5 text-center"></i>
                                <span>Keluar Akun</span>
                            </button>
                        </div>
                    </aside>

                    <!-- Main Content Panel with Cinematic Fade-In-Up & Pop Animation -->
                    <main class="flex-1 p-4 sm:p-6 md:p-8 overflow-y-auto bekalin-gradient animate-fade-in">
                        ${renderTabContent()}
                    </main>
                </div>

                <!-- Mobile Bottom Navigation Bar -->
                <nav aria-label="Mobile Navigation" class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t-2 border-indigo-600 z-40 px-3 py-2 flex justify-around items-center shadow-lg">

                                    <div class="p-3 bg-indigo-50 border-2 border-indigo-400 rounded-xl font-bold text-indigo-900 text-sm flex justify-between items-center shadow-sm">
                                        <span>10.00 - 11.30: Sesi Tanya Jawab & Konsultasi BK</span>
                                        <span class="text-xs bg-indigo-600 text-white px-2.5 py-1 rounded-full font-black">Terjadwal</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderKonsulTab() {
            return `
                <div class="space-y-6 max-w-5xl mx-auto animate-fade-in">
                    <div class="bg-white p-6 rounded-3xl border-2 border-indigo-600 shadow-[6px_6px_0px_#5746d8] animate-pop-in">
                        <h1 class="text-3xl font-black text-indigo-900">KONSULTASI & KARIER</h1>
                        <p class="text-sm text-slate-500 mt-1">Layanan BK, tes minat bakat, dan informasi magang vokasi.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-3xl border-2 border-indigo-600 shadow-[6px_6px_0px_#5746d8] flex flex-col justify-between animate-pop-in stagger-1">
                            <div>
                                <div class="w-12 h-12 rounded-2xl bg-indigo-100 border-2 border-indigo-600 text-indigo-700 flex items-center justify-center text-xl mb-4 shadow"><i class="fa-solid fa-compass"></i></div>
                                <h3 class="font-black text-xl text-indigo-900 mb-2">Tes Minat Bakat</h3>
                                <p class="text-sm text-slate-600 mb-6">Temukan rekomendasi penjurusan kuliah dan karier masa depan berdasarkan survei psikometri tervalidasi.</p>
                            </div>
                            <button onclick="showNotification('Survei Minat', 'Modul survei minat dan bakat akan segera dimuat.', 'info')" class="w-full bekalin-button py-3 text-sm">Mulai Tes Minat</button>
                        </div>

                        <div class="bg-white p-6 rounded-3xl border-2 border-indigo-600 shadow-[6px_6px_0px_#5746d8] flex flex-col justify-between animate-pop-in stagger-2">
                            <div>
                                <div class="w-12 h-12 rounded-2xl bg-pink-100 border-2 border-pink-600 text-pink-700 flex items-center justify-center text-xl mb-4 shadow"><i class="fa-solid fa-briefcase"></i></div>
                                <h3 class="font-black text-xl text-indigo-900 mb-2">Info Magang Vokasi</h3>
                                <p class="text-sm text-slate-600 mb-6">Informasi lowongan magang industri resmi mitra perusahaan untuk siswa.</p>
                            </div>
                            <button onclick="showNotification('Katalog Magang', 'Menampilkan daftar mitra industri dan lowongan magang aktif.', 'info')" class="w-full bekalin-button py-3 text-sm">Lihat Lowongan Magang</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProfilTab() {
            const u = state.user;
            return `
                <div class="max-w-3xl mx-auto space-y-6 animate-fade-in">
                    <div class="bg-white p-6 md:p-8 rounded-3xl border-2 border-indigo-600 shadow-[6px_6px_0px_#5746d8] animate-pop-in">
                        <div class="flex items-center space-x-4 mb-6 pb-6 border-b-2 border-slate-100">
                            <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-indigo-600 to-pink-600 text-white flex items-center justify-center font-black text-3xl shadow-lg border-2 border-white hover:scale-105 transition">
                                ${u.name.charAt(0)}
                            </div>
                            <div>
                                <h1 class="text-2xl font-black text-indigo-900" id="profileName">${u.name}</h1>
                                <p class="text-sm text-slate-500" id="profileEmail">${u.email} • <span class="capitalize text-pink-600 font-bold">${u.role}</span></p>
                            </div>
                        </div>

                        <form id="profile-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nama Lengkap</label>
                                <input type="text" id="prof-name" value="${u.name}" required class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm focus:outline-none focus:border-pink-600 transition shadow-inner">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Username</label>
                                <input type="text" id="prof-username" value="${u.username || ''}" required class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm focus:outline-none focus:border-pink-600 transition shadow-inner">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Bio / Deskripsi Diri</label>
                                <textarea id="prof-bio" rows="3" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm focus:outline-none focus:border-pink-600 transition shadow-inner">${u.bio || ''}</textarea>
                            </div>
                            <button type="submit" class="w-full bekalin-button py-3.5 text-sm">Simpan Perubahan Profil</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderTeacherTab() {
            return `
                <div class="space-y-6 max-w-5xl mx-auto animate-fade-in">
                    <div class="bg-white p-6 rounded-3xl border-2 border-indigo-600 shadow-[6px_6px_0px_#5746d8] flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 animate-pop-in">
                        <div>
                            <h1 class="text-3xl font-black text-indigo-900">PANEL GURU: Tambah Ujian & Edit</h1>
                            <p class="text-sm text-slate-500 mt-1">Kelola soal ujian, input nilai, dan materi pembelajaran.</p>
                        </div>
                        <button onclick="showNotification('Tambah Ujian', 'Membuka form penambahan ujian baru.', 'success')" class="bekalin-button px-5 py-2.5 text-sm whitespace-nowrap">
                            <i class="fa-solid fa-plus mr-2"></i> Tambah Ujian Baru
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-3xl border-2 border-indigo-600 shadow-[6px_6px_0px_#5746d8] animate-pop-in stagger-1">
                            <h3 class="font-black text-lg text-indigo-900 mb-2">Tambah Ujian</h3>
                            <p class="text-xs text-slate-500 mb-4">Buat soal pilihan ganda atau esai baru untuk kelas.</p>
                            <button onclick="showNotification('Menu Ujian', 'Membuka editor ujian.', 'info')" class="w-full bekalin-button py-2 text-xs">Buka Editor</button>
                        </div>
                        <div class="bg-white p-6 rounded-3xl border-2 border-indigo-600 shadow-[6px_6px_0px_#5746d8] animate-pop-in stagger-2">
                            <h3 class="font-black text-lg text-indigo-900 mb-2">Lihat Hasil</h3>
                            <p class="text-xs text-slate-500 mb-4">Rekapitulasi nilai dan laporan ujian siswa.</p>
                            <button onclick="showNotification('Hasil Ujian', 'Menampilkan rekap nilai siswa.', 'info')" class="w-full bekalin-button py-2 text-xs">Lihat Rekap</button>
                        </div>
                        <div class="bg-white p-6 rounded-3xl border-2 border-indigo-600 shadow-[6px_6px_0px_#5746d8] animate-pop-in stagger-3">
                            <h3 class="font-black text-lg text-indigo-900 mb-2">Edit Materi</h3>
                            <p class="text-xs text-slate-500 mb-4">Perbarui modul bab dan kurikulum pelajaran.</p>
                            <button onclick="showNotification('Edit Materi', 'Membuka editor materi.', 'info')" class="w-full bekalin-button py-2 text-xs">Edit Modul</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminTab() {
            return `
                <div class="space-y-6 max-w-5xl mx-auto animate-fade-in">
                    <div class="bg-white p-6 rounded-3xl border-2 border-indigo-600 shadow-[6px_6px_0px_#5746d8] animate-pop-in">
                        <h1 class="text-3xl font-black text-indigo-900">MENU ADMIN SEKOLAH</h1>
                        <p class="text-sm text-slate-500 mt-1">Konfigurasi sistem, akun guru, dan pengaturan platform Bekalin.</p>
                    </div>

                    <div class="bg-white p-6 rounded-3xl border-2 border-indigo-600 shadow-[6px_6px_0px_#5746d8] animate-pop-in stagger-1">
                        <h3 class="font-black text-xl text-indigo-900 mb-4">Manajemen Hak Akses Sekolah</h3>
                        <div class="p-4 rounded-2xl border-2 border-indigo-300 bg-indigo-50 text-indigo-900 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm">
                            <div>
                                <p class="font-black text-sm">Status Sumber Materi: <span class="uppercase">${state.user.sourceMode}</span></p>
                                <p class="text-xs text-indigo-700 mt-0.5">Sinkronisasi data sekolah dengan pusat terverifikasi.</p>
                            </div>
                            <span class="px-4 py-1.5 bg-pink-600 text-white text-xs font-black rounded-full border border-pink-800 whitespace-nowrap shadow">Aktif Resmi</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            if (!state.user || state.currentView !== 'dashboard') {
                renderAuth();
            } else {
                renderDashboard();
                if (state.activeTab === 'profil') {
                    setTimeout(() => {
                        const form = document.getElementById('profile-form');
                        if (form) {
                            form.onsubmit = (e) => {
                                e.preventDefault();
                                state.user.name = document.getElementById('prof-name').value;
                                state.user.username = document.getElementById('prof-username').value;
                                state.user.bio = document.getElementById('prof-bio').value;
                                showNotification('Profil Diperbarui', 'Perubahan profil berhasil disimpan.', 'success', () => render());
                            };
                        }
                    }, 50);
                }
            }
        }

        window.onload = function () {
            render();
        };
    </script>
</body>
</html>
